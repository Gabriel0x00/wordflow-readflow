<!DOCTYPE html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#083f43"><title>Actualizar ReadFlow</title><style>body{background:#083f43;color:white;font:16px system-ui;margin:0;padding:36px 24px;max-width:480px;margin:auto}img{width:100px;border-radius:24px}p{line-height:1.6;color:#c0cce4}button{background:#8e8aff;color:#083f43;font:bold 16px system-ui;border:0;border-radius:12px;padding:16px;width:100%;cursor:pointer}</style><img src="logo.png" alt="ReadFlow"><h1>Actualiza tu ReadFlow</h1><p>Esta reparación carga la versión más reciente y mantiene tus libros, notas, palabras y progreso en este navegador. Conserva la misma instalación: no necesitas desinstalar la app.</p><button id="go">Actualizar ReadFlow</button><p id="status" role="status"></p><script>
document.getElementById('go').onclick=async()=>{const button=document.getElementById('go');button.disabled=true;document.getElementById('status').textContent='Preparando la nueva versión…';try{
 const response=await fetch('./version.json?t='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!response.ok||!(response.headers.get('content-type')||'').includes('json'))throw Error('Abre este enlace en Chrome y comprueba que estás en tu dirección nueva.');const version=await response.json();
 if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistration('./');if(r)await r.unregister();}
 if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('readflow-shell-')).map(k=>caches.delete(k)));}
 location.replace('./?updated='+encodeURIComponent(version.version)+'&t='+Date.now());
 }catch(error){button.disabled=false;document.getElementById('status').textContent=error.message;}};
</script></html>
